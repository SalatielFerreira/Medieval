# Publica o jogo no GitHub Pages a cada envio para o ramo main.
# Antes de publicar, grava em version.json uma versão nova (data + commit):
# o menu do jogo compara essa versão com a que está aberta e oferece o botão "Atualizar".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gravar a versão
        run: echo "{\"version\":\"$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}\"}" > version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
