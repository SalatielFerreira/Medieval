# Publica o jogo no GitHub Pages a cada envio para o ramo main.
# Antes de publicar, grava em version.json uma versão nova (data + commit):
# o menu do jogo compara essa versão com a que está aberta e oferece o botão "Atualizar".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # usa a versão gravada no commit (o gancho local atualiza a cada commit);
      # se o commit não mudou version.json (edição pelo site do GitHub), cria uma nova
      - name: Gravar a versão
        run: |
          if git diff --quiet HEAD~1 HEAD -- version.json 2>/dev/null; then
            echo "{\"version\":\"$(date -u +%Y%m%d-%H%M%S)\"}" > version.json
          fi
          cat version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
